[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skill-config"
version = "0.1.0"
description = "Per-skill config and secrets store for pi-chat"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "tomlkit",
  "pyyaml",
]

[project.scripts]
skill-config = "skill_config:main"

[tool.hatch.build.targets.wheel]
only-include = ["skill_config.py", "skill_store.py"]
