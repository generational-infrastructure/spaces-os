[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "integration-signal"
version = "0.1.0"
description = "Signal MCP integration server (spaces integration)"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["spaces-integration-mcp", "spaces-signal-cli"]

[tool.hatch.build.targets.wheel]
only-include = ["integration_signal.py"]

[project.scripts]
integration-signal = "integration_signal:main"
